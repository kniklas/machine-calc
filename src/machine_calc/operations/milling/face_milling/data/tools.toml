# Bundled default face-mill tools (specs/009-milling-calculations FR-006,
# FR-015).
#
# Same schema and style as `end_milling/data/tools.toml`; factors are
# relative to the HSS baseline (factor 1.0) stored in
# `machine_calc.registry`'s material reference values
# (research.md #3). Face milling is dominated by indexable-insert cutters,
# so the bundled set starts at carbide rather than HSS, and the highest
# entry reflects the higher speeds cermet inserts tolerate in finishing
# passes (Machinery's Handbook / Sandvik Coromant general-purpose ranges).
#
# No `feed_factor` key: feed per tooth is a direct per-calculation input
# (research.md #4).
#
# The table key is `face_mill_tools`, distinct from both `tools` (drilling)
# and `end_mill_tools` (contracts/milling-tools-config-schema.md).

[[face_mill_tools]]
name = "HSS"
cutting_speed_factor = 1.0
unit_system = "metric"

[[face_mill_tools]]
name = "Carbide"
cutting_speed_factor = 2.5
unit_system = "metric"

[[face_mill_tools]]
name = "Coated Carbide"
cutting_speed_factor = 3.0
unit_system = "metric"

[[face_mill_tools]]
name = "Cermet"
cutting_speed_factor = 3.5
unit_system = "metric"
